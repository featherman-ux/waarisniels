name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main  # Runs every time you push to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # Required for the Cloudflare Action
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build  # This runs "astro build" and creates the /dist folder

      - name: Deploy to Cloudflare Pages
        # wrangler pages deploy (i.p.v. pages-action@v1) leest de D1/R2/KV/AI-bindings
        # rechtstreeks uit wrangler.toml, zodat dat bestand de enige waarheid is en de
        # handmatige dashboard-bindings (docs/cloudflare-setup.md §4) kunnen vervallen.
        run: npx wrangler pages deploy dist --project-name=waarisniels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 41e06ef76f253fc7135939d93e4e12df