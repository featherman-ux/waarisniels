
name = "waarisniels"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-28"
compatibility_flags = ["nodejs_compat"]

# Fixed KV namespace binding - use consistent naming
[[kv_namespaces]]
binding = "ANALYTICS_KV"  # This matches what your API endpoints expect
id = "adadbaa37ca743d5a6c3e3b2d311fb3c"
preview_id = "adadbaa37ca743d5a6c3e3b2d311fb3c"

# Optional: Keep session binding if needed
[[kv_namespaces]]
binding = "SESSION"
id = "adadbaa37ca743d5a6c3e3b2d311fb3c" 
preview_id = "adadbaa37ca743d5a6c3e3b2d311fb3c"

# --- D1: alle posts (zie migrations/0001_init.sql) ---
[[d1_databases]]
binding = "DB"
database_name = "waarisniels-db"
database_id = "521457be-9610-4e58-9793-b29e78fc0fb9"

# --- R2: alle foto's en video's ---
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "waarisniels-media"

# Add this if you don't have it already, for the AI model access
[ai]
binding = "AI"
